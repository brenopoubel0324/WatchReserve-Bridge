name: Wear Bridge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Preparar SDK e NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Compilar e analisar
        run: ./gradlew --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest :wear:testDebugUnitTest :wear:lintDebug
      - name: Conferir sintaxe do roteiro AVD
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('Test-WearBridge.ps1', 'Test-RestorationJournals.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/scripts/$script", [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-wear
          path: |
            wear/build/reports/lint-results-debug.*
            wear/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
