plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.brenopoubel.watchreserve.bridge'
    defaultConfig {
        applicationId 'dev.brenopoubel.watchreserve.bridge'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1-wear-readonly'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=none' }
        }
    }
    buildFeatures { buildConfig true; prefab true }
    signingConfigs { persistent }
    def credentialsPath = System.getenv('WATCHRESERVE_BRIDGE_SIGNING')
    if (credentialsPath) {
        def credentials = new Properties()
        file(credentialsPath).withInputStream { credentials.load(it) }
        signingConfigs.persistent {
            storeFile file(credentials.getProperty('storeFile'))
            storePassword credentials.getProperty('storePassword')
            keyAlias credentials.getProperty('keyAlias')
            keyPassword credentials.getProperty('keyPassword')
        }
    }
    buildTypes {
        debug { if (credentialsPath) signingConfig signingConfigs.persistent }
        release {
            signingConfig signingConfigs.persistent
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/jni/CMakeLists.txt'; version '3.22.1' }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true; disable 'RestrictedApi' }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation project(':server')
    implementation project(':starter')
    implementation project(':api')
    implementation project(':provider')
    implementation 'org.lsposed.libcxx:libcxx:29.0.14206865'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
